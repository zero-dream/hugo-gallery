<footer>
	{{ partialCached "icons/social.html" $ }}
	<section>
		<span>
			{{ with $.Site.Copyright }}
				{{ . | markdownify }} · 
			{{ end }}
			{{/* Warning: The following Powered content is prohibited from being modified or deleted! */}}
			Powered by 
			<a target="_blank" rel="noopener noreferrer" href="https://github.com/gohugoio/hugo/">Hugo</a> & 
			<a target="_blank" rel="noopener noreferrer" href="https://github.com/zero-dream/hugo-gallery/">ZeroDream</a>
		</span>
		{{ range $.Site.Menus.footer }}
			<a {{ with .Params.rel }}rel="{{ . }}"{{ end }} href="{{ .URL }}">
				{{ .Name }}
			</a>
		{{ end }}
	</section>
</footer>
